name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: this workflow never needs to write to the repository.
permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements-dev.txt
      - name: pytest
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: The bundle must not ship the question bank's answer key
        run: |
          if grep -rqF "why_it_matters" frontend/dist/assets/; then
            echo "::error::remediation copy leaked into the frontend bundle"
            exit 1
          fi

  infra:
    name: CDK synth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
        working-directory: infra
      - run: npx tsc --noEmit
        working-directory: infra
      - name: cdk synth
        working-directory: infra
        run: npx cdk synth --quiet
